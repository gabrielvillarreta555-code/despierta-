name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias y análisis
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Compilar APK instalable
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas en Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p app/build/outputs/androidTest-results/diagnostics
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell cmd package compile -m speed -f com.example.despierta
            adb shell cmd package compile -m speed -f com.example.despierta.test
            sleep 20
            adb logcat -c
            adb shell am instrument -w -r com.example.despierta.test/androidx.test.runner.AndroidJUnitRunner > app/build/outputs/androidTest-results/diagnostics/instrumentation.txt 2>&1 || true
            cat app/build/outputs/androidTest-results/diagnostics/instrumentation.txt
            adb logcat -d -v threadtime > app/build/outputs/androidTest-results/diagnostics/logcat.txt || true
            grep -q '^OK (' app/build/outputs/androidTest-results/diagnostics/instrumentation.txt

      - name: Publicar informes instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-Pruebas-Android16
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
