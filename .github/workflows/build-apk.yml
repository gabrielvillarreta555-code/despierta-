name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias y análisis
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Compilar APK instalable
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar y verificar Despierta 2.3
        shell: bash
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/despierta-2.3"
          mkdir -p "$release_dir"
          cp app/build/outputs/apk/debug/app-debug.apk "$release_dir/Despierta-2.3.apk"
          commit_sha="$(git rev-parse HEAD)"
          aapt_path="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt_path" dump badging "$release_dir/Despierta-2.3.apk" | tee "$release_dir/manifest-badging.txt"
          grep -q "versionCode='6' versionName='2.3'" "$release_dir/manifest-badging.txt"
          unzip -p "$release_dir/Despierta-2.3.apk" 'classes*.dex' > "$RUNNER_TEMP/despierta-classes.dex"
          strings "$RUNNER_TEMP/despierta-classes.dex" > "$RUNNER_TEMP/despierta-classes.txt"
          grep -Fq "${commit_sha:0:12}" "$RUNNER_TEMP/despierta-classes.txt"
          {
            echo "commit=$commit_sha"
            echo "versionName=2.3"
            echo "versionCode=6"
            sha256sum "$release_dir/Despierta-2.3.apk"
          } > "$release_dir/BUILD-INFO.txt"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-2.3
          path: app/build/outputs/despierta-2.3/
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas en Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p app/build/outputs/androidTest-results/diagnostics
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
            bash .github/scripts/wait-for-android.sh app/build/outputs/androidTest-results/diagnostics/emulator-readiness.txt
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell cmd package compile -m speed -f com.example.despierta
            adb shell cmd package compile -m speed -f com.example.despierta.test
            adb logcat -c
            adb shell am instrument -w -r com.example.despierta.test/androidx.test.runner.AndroidJUnitRunner > app/build/outputs/androidTest-results/diagnostics/instrumentation.txt 2>&1 || true
            cat app/build/outputs/androidTest-results/diagnostics/instrumentation.txt
            adb logcat -d -v threadtime > app/build/outputs/androidTest-results/diagnostics/logcat.txt || true
            grep -q '^OK (' app/build/outputs/androidTest-results/diagnostics/instrumentation.txt
            adb shell settings put system font_scale 1.30
            adb shell am force-stop com.example.despierta
            set +e
            adb shell am instrument -w -r \
              -e class com.example.despierta.AlarmScreenInstrumentedTest \
              com.example.despierta.test/androidx.test.runner.AndroidJUnitRunner \
              > app/build/outputs/androidTest-results/diagnostics/alarm-screen-instrumentation.txt 2>&1
            screenshot_test_status=$?
            set -e
            adb shell settings put system font_scale 1.0 || true
            cat app/build/outputs/androidTest-results/diagnostics/alarm-screen-instrumentation.txt
            test "$screenshot_test_status" -eq 0
            grep -q '^OK (' app/build/outputs/androidTest-results/diagnostics/alarm-screen-instrumentation.txt
            adb exec-out run-as com.example.despierta \
              cat files/Despierta-2.3-Alarma-activa.png \
              > app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Alarma-activa.png
            test -s app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Alarma-activa.png
            adb shell pm grant com.example.despierta android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.example.despierta
            adb shell am start -W -n com.example.despierta/.MainActivity
            sleep 3
            adb exec-out screencap -p > app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Inicio.png
            test -s app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Inicio.png

      - name: Publicar informes instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-2.3-Pruebas-Android16
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar capturas reales Despierta 2.3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Despierta-2.3-Capturas
          path: |
            app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Alarma-activa.png
            app/build/outputs/androidTest-results/diagnostics/Despierta-2.3-Inicio.png
          if-no-files-found: warn
          retention-days: 14
